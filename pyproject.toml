[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridscout"
version = "0.1.0"
description = "Explainable Texas battery storage opportunity discovery"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["gridscout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
